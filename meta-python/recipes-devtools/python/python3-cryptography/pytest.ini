# The [pytest] section of tox.ini from cryptography 2.8, which is not in
# the sdist. It registers the custom marks the tests use.
[pytest]
addopts = -r s
markers =
    requires_backend_interface: this test requires a specific backend interface
    supported: parametrized test requiring only_if and skip_message
    wycheproof_tests: this test runs a wycheproof fixture
