---
# Reusable workflow: Shared workflow for periodic builds
name: '[Reusable] Periodic'
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      run-tests:
        description: 'If "true", run testimage after the build'
        required: false
        default: true
        type: boolean
      target-image:
        description: 'The image that is intended to be built'
        required: false
        default: 'core-image-minimal'
        type: string
      use-cache:
        description: 'If "true", restore downloads and sstate before the build'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  check-layer:
    name: Check layer
    needs: lint
    uses: ./.github/workflows/_yocto-check-layer.yml
    with:
      branch: kirkstone
      runner: ubuntu-22.04

  build:
    name: 'Build (systemd=${{ matrix.systemd }})'
    needs: check-layer
    strategy:
      matrix:
        systemd: [true, false]
    uses: ./.github/workflows/_bitbake.yml
    with:
      branch: kirkstone
      runner: yocto_build_host
      only-build-modified: false
      run-tests: ${{ inputs.run-tests }}
      target-image: ${{ inputs.target-image }}
      use-cache: ${{ inputs.use-cache }}
      use-systemd: ${{ matrix.systemd }}

  update-cve-dashboard:
    uses: ./.github/workflows/_update-cve-dashboard.yml
