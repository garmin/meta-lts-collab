---
# Reusable workflow: Shared workflow for periodic builds
name: '[Reusable] Periodic'
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      target-image:
        description: 'The image that is intended to be built'
        required: false
        default: 'core-image-minimal'
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  check-layer:
    name: Check layer
    needs: lint
    uses: ./.github/workflows/_yocto-check-layer.yml
    with:
      branch: kirkstone
      runner: ubuntu-22.04

  build:
    name: 'Build (systemd=${{ matrix.systemd }})'
    needs: check-layer
    strategy:
      matrix:
        systemd: [true, false]
    uses: ./.github/workflows/_bitbake.yml
    with:
      branch: kirkstone
      runner: yocto_build_host
      only-build-modified: false
      run-tests: true
      target-image: ${{ inputs.target-image }}
      use-cache: false
      use-systemd: ${{ matrix.systemd }}

  cve-check:
    name: 'CVE check (${{ matrix.branch }})'
    strategy:
      matrix:
        branch: [dunfell, kirkstone]
    uses: ./.github/workflows/_cve-check.yml
    with:
      branch: ${{ matrix.branch }}
      runner: ubuntu-22.04
    secrets:
      nvd-api-key: ${{ secrets.NVD_API_KEY }}

  deploy-cve-report:
    name: 'Deploy CVE report to Pages'
    needs: cve-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Stage static site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_html"
          cp "$GITHUB_WORKSPACE"/.github/cve-report/* "$GITHUB_WORKSPACE/_html/"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: cve-summary-*
          path: ${{ github.workspace }}/_html
          merge-multiple: true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ github.workspace }}/_html

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
