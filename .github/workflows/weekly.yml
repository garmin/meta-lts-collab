---
name: Weekly
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  periodic:
    uses: ./.github/workflows/_periodic.yml
    with:
      target-image: core-image-ptest-all
      use-cache: false
