---
name: Weekly
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  common:
    name: "Common (${{ matrix.branch }})"
    strategy:
      matrix:
        include:
          - branch: dunfell
            use-buildtools: true
          - branch: kirkstone
            use-buildtools: false
    uses: ./.github/workflows/_common.yml
    with:
      branch: ${{ matrix.branch }}
      use-buildtools: ${{ matrix.use-buildtools }}
      meta-lts-collab-ref: ${{ matrix.branch }}
      target-image: core-image-ptest-all

  update-cve-dashboard:
    uses: ./.github/workflows/_update-cve-dashboard.yml
