---
name: Nightly
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 3 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  common:
    name: "Common"
    uses: ./.github/workflows/_common.yml
    with:
      target-image: core-image-ptest-fast

  update-cve-dashboard:
    uses: ./.github/workflows/_update-cve-dashboard.yml
