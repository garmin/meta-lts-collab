---
name: PR Validation
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["kirkstone"]

permissions:
  contents: read

jobs:
  common:
    name: "Common"
    uses: ./.github/workflows/_common.yml
    with:
      branch: kirkstone
      only-build-modified: true

  validate-pr-status:
    name: Required checks pass
    needs: common
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check all jobs succeeded
        env:
          HAS_FAILED_JOBS: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED_JOBS: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$HAS_FAILED_JOBS" = "true" ] || \
             [ "$HAS_CANCELLED_JOBS" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
